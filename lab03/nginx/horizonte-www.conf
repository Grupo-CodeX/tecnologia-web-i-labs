# /etc/nginx/sites-available/horizonte-www.conf — Sitio institucional de la U.E. Horizonte
server {
    listen 80;
    listen [::]:80;
    server_name www.horizonte.internal horizonte.internal;

    root  /srv/horizonte/www;
    index index.html;

    access_log /var/log/nginx/horizonte-www.access.log horizonte;
    # TODO 1: error_log propio con nivel warn
    error_log  /var/log/nginx/horizonte-www.error.log warn;

    # TODO 2: sin www -> con www (redirección permanente)
    if ($host = horizonte.internal) {
        return 301 http://www.horizonte.internal$request_uri;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # TODO 3: estáticos con caché de 7 días y sin registro
    location ~* \.(css|js|png|jpg|jpeg|webp|svg|ico|woff2)$ {
        expires 7d;
        access_log off;
    }

    # TODO 4: listado automático de circulares
    location /circulares/ {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    # Archivos ocultos (.git, .env…) nunca se publican
    location ~ /\. {
        deny all;
    }

    # TODO 5: páginas de error propias, visibles solo como error
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /404.html { internal; }
    location = /50x.html { internal; }
}
